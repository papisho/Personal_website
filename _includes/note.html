<article class="note-card"><p class="eyebrow">{{ include.post.category | default: 'NOTES' | escape }} <span> / </span><time datetime="{{ include.post.date | date: '%Y-%m-%d' }}">{{ include.post.date | date: '%b %d, %Y' }}</time></p><h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3><p>{{ include.post.description | default: include.post.excerpt | strip_html | truncate: 170 | escape }}</p><a class="text-link" href="{{ include.post.url | relative_url }}">Read note ↗</a></article>
